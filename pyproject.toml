[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-textstats"
version = "0.1.1"
description = "DIVE-ready text statistics helpers for Python, notebooks, and the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Marcello Raphael Christiano Pardede", email = "marcelloraphael17@gmail.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
keywords = ["text", "statistics", "reading-time", "cli", "cs1302", "hermes"]

[project.optional-dependencies]
test = ["pytest >= 8"]
build = ["build", "twine"]

[project.scripts]
hermes-textstats = "hermes_textstats.cli:main"

[project.urls]
Homepage = "https://github.com/cilmar748/hermes-textstats"
Source = "https://github.com/cilmar748/hermes-textstats"
Issues = "https://github.com/cilmar748/hermes-textstats/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
